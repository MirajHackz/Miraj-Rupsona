<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miraj Rupsona</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Poppins',sans-serif;
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff4d6d,#ff8fab,#ffc2d1);
}

#intro{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff1744,#ff80ab);
z-index:9999;
}

#intro h1{
font-family:'Great Vibes',cursive;
font-size:75px;
color:white;
text-shadow:0 0 25px white;
animation:zoom 3s forwards;
}

@keyframes zoom{
0%{transform:scale(.5);opacity:0}
100%{transform:scale(1);opacity:1}
}

.main{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:90%;
max-width:750px;
padding:30px;
border-radius:30px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
text-align:center;
}

.photo{
width:230px;
height:230px;
border-radius:50%;
object-fit:cover;
border:6px solid white;
}

.heading{
font-family:'Great Vibes',cursive;
font-size:55px;
color:white;
margin:20px 0;
text-shadow:0 0 15px white;
}

.buttons{
position:relative;
height:150px;
margin-top:25px;
}

button{
padding:15px 40px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:50px;
cursor:pointer;
}

#yes{background:#00c853;color:white}
#no{background:#ff1744;color:white;position:absolute;left:65%}

#result{
display:none;
font-size:32px;
color:white;
margin-top:20px;
font-weight:bold;
}

audio{
display:none;
}
</style>
</head>
<body>

<div id="intro">
<h1>Miraj Rupsona</h1>
</div>

<div class="main">
<div class="card">

<img src="rupsona.png" class="photo">

<div class="heading">Miraj Rupsona</div>

<h2 style="color:white">Do You Love Me..❤️</h2>

<audio id="music" loop>
<source src="nasheed.mp3" type="audio/mpeg">
</audio>

<div class="buttons">
<button id="yes">YES ❤️</button>
<button id="no">NO 😜</button>
</div>

<div id="result">
🎉 Alhamdulillah 🎉<br>
Rupsona Said YES ❤️💍
</div>

</div>
</div>

<script>
setTimeout(()=>{
document.getElementById("intro").style.display="none";
},3000);

const noBtn=document.getElementById("no");

function moveButton(){
const x=Math.random()*(window.innerWidth-150);
const y=Math.random()*(window.innerHeight-100);

noBtn.style.position="fixed";
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
}

noBtn.addEventListener("mouseover",moveButton);

document.getElementById("yes").addEventListener("click",()=>{
document.getElementById("result").style.display="block";
document.getElementById("music").play();
});
</script>

</body>
</html>
