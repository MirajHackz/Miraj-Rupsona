<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miraj ❤️ Rupsona</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;
background:linear-gradient(-45deg,#ff4d6d,#ff758f,#ff8fa3,#ffc2d1);
background-size:400% 400%;animation:bg 12s ease infinite;
}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.card{
width:90%;max-width:750px;text-align:center;padding:30px;border-radius:30px;
background:rgba(255,255,255,.15);backdrop-filter:blur(15px);color:white;
box-shadow:0 0 40px rgba(0,0,0,.2)
}
img{width:220px;height:220px;border-radius:50%;object-fit:cover;border:5px solid #fff}
h1{margin:15px 0}
.type{min-height:40px;margin:15px 0}
.btns{position:relative;height:140px}
button{padding:14px 32px;border:none;border-radius:50px;font-size:20px;cursor:pointer}
#yes{background:#00d26a;color:#fff}
#no{background:#ff2e63;color:#fff;position:absolute;left:60%}
#message{margin-top:20px;font-size:28px;font-weight:bold}
.floating{position:absolute;animation:float linear forwards}
@keyframes float{from{transform:translateY(100vh)}to{transform:translateY(-150px);opacity:0}}
</style>
</head>
<body>

<audio id="bgMusic" loop>
<source src="banjarani.mp3" type="audio/mpeg">
</audio>

<div class="card">
<img src="rupsona.jpg" alt="Photo">
<h1>Will You Marry Me? ❤️</h1>
<div class="type" id="type"></div>

<div class="btns">
<button id="yes">YES 💍</button>
<button id="no">NO 😅</button>
</div>

<div id="message"></div>
</div>

<script>
document.addEventListener("click",()=>{
 let m=document.getElementById("bgMusic");
 m.play().catch(()=>{});
},{once:true});

const text="You are the most special person in my life ❤️";
let i=0;
(function type(){
 if(i<text.length){
  document.getElementById("type").innerHTML+=text.charAt(i++);
  setTimeout(type,60);
 }
})();

const no=document.getElementById("no");
const yes=document.getElementById("yes");
let scale=1;

function moveNo(){
 no.style.left=Math.random()*(window.innerWidth-150)+"px";
 no.style.top=Math.random()*(window.innerHeight-100)+"px";
 scale+=0.08;
 yes.style.transform=`scale(${scale})`;
}
no.addEventListener("mouseover",moveNo);
no.addEventListener("click",moveNo);

yes.onclick=()=>{
 document.querySelector(".card").innerHTML=`
 <h1 style="font-size:60px">💍❤️</h1>
 <h1>YAY! 🎉</h1>
 <h2>Thank You For Saying YES ❤️</h2>`;

 for(let i=0;i<200;i++){
  let h=document.createElement("div");
  h.className="floating";
  h.innerHTML=["❤️","💖","💕","💘"][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=(20+Math.random()*50)+"px";
  h.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
 }
};

setInterval(()=>{
 let h=document.createElement("div");
 h.className="floating";
 h.innerHTML="❤️";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration="6s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
},500);
</script>
</body>
</html>
